rules:
  - id: hardcoded-api-key
    message: >-
      Posible secreto o credencial hardcodeado. Nunca coloques API keys,
      contraseñas o tokens en el código fuente. Usa variables de entorno
      (import.meta.env.*) y secrets de CI/CD.
    languages: [javascript, typescript, jsx, tsx]
    severity: ERROR
    patterns:
      - pattern-regex: >-
          (?i)(api[_-]?key|access[_-]?key|secret[_-]?key|client[_-]?secret|
          auth[_-]?token|access[_-]?token|refresh[_-]?token|private[_-]?key|
          passwd|password)\s*[:=]\s*["'][A-Za-z0-9_+\/.\-]{12,}["']
    metadata:
      category: security
      technology:
        - javascript

  - id: hardcoded-jwt
    message: >-
      Token JWT hardcodeado detectado (formato 'eyJ...'). Los tokens deben
      rotarse y gestionarse desde el servidor, nunca en código fuente.
    languages: [javascript, typescript, jsx, tsx, generic]
    severity: ERROR
    pattern-regex: >-
      eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{5,}

  - id: aws-access-key
    message: >-
      Posible Access Key de AWS detectado. Rota la credencial y revócala
      inmediatamente.
    languages: [generic]
    severity: ERROR
    pattern-regex: \b(AKIA|ASIA)[0-9A-Z]{16}\b

  - id: github-personal-access-token
    message: >-
      Posible GitHub Personal Access Token detectado (prefijo ghp_/gho_/ghu_/
      ghs_/ghr_). Revócalo en GitHub y gíralo desde secrets.
    languages: [generic]
    severity: ERROR
    pattern-regex: \b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\b

  - id: google-api-key
    message: >-
      Posible API Key de Google detectado (prefijo AIza). Revócala desde Google
      Cloud Console.
    languages: [generic]
    severity: ERROR
    pattern-regex: \bAIza[0-9A-Za-z\-_]{30,}\b

  - id: slack-bot-token
    message: >-
      Posible token de Slack detectado (prefijo xoxb/xoxa/xoxp/xoxr). Revócalo
      y no lo expongas en el repositorio.
    languages: [generic]
    severity: ERROR
    pattern-regex: xox[baprs]-[0-9A-Za-z-]{10,}

  - id: private-key-block
    message: >-
      Bloque de llave privada detectado. Las llaves privadas nunca deben
      versionarse; usa un gestor de secretos.
    languages: [generic]
    severity: ERROR
    pattern-regex: >-
      -----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----

  - id: slack-webhook-url
    message: >-
      Webhook de Slack detectado. Los webhooks permiten inyectar mensajes y
      deben tratarse como secretos.
    languages: [generic]
    severity: ERROR
    pattern-regex: https://hooks\.slack\.com/services/T[A-Za-z0-9_]{8,}/B[A-Za-z0-9_]{8,}/[A-Za-z0-9_]{20,}
