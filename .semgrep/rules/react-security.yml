rules:
  - id: react-anchor-target-blank-noopener
    message: >-
      Enlace con target="_blank" sin rel="noopener noreferrer". Esto expone a
      la vulnerabilidad de "reverse tabnabbing". Añade
      rel="noopener noreferrer" a todos los enlaces externos.
    languages: [jsx, tsx]
    severity: ERROR
    patterns:
      - pattern: <$TAG ... target="_blank" ...>
      - pattern-not: <$TAG ... rel="noopener" ...>
      - pattern-not: <$TAG ... rel="noreferrer" ...>
      - pattern-not: <$TAG ... rel="noopener noreferrer" ...>
      - pattern-not: <$TAG ... rel="noreferrer noopener" ...>

  - id: react-no-session-token-in-components
    message: >-
      Escritura de valores de sesión/autorización en almacenamiento desde un
      archivo arbitrario. Toda la gestión de tokens debe pasar por
      src/lib/auth.ts. No almacenes tokens ni secretos en el navegador salvo
      en los helpers centralizados.
    languages: [jsx, tsx, typescript]
    severity: ERROR
    patterns:
      - pattern-regex: >-
          (?:localStorage|sessionStorage)\.setItem\(\s*["'][^"']*(?:token|session|access|refresh|auth|password|credential)[^"']*["']
    paths:
      exclude:
        - src/lib/auth.ts

  - id: react-iframe-sandbox-missing
    message: >-
      iframe sin atributo sandbox. Añade sandbox="allow-scripts allow-same-origin"
      únicamente si es imprescindible, o usa las restricciones mínimas.
    languages: [jsx, tsx]
    severity: WARNING
    patterns:
      - pattern: <iframe ...>
      - pattern-not: <iframe ... sandbox=...>

  - id: react-img-non-https
    message: >-
      Imagen cargada con protocolo http://. Usa https:// para evitar contenido
      mezclado y ataques MITM.
    languages: [jsx, tsx]
    severity: WARNING
    pattern-regex: \b(?:src|href|poster)\s*[:=]\s*["']http://

  - id: react-unsafe-form-action
    message: >-
      Formulario con action hacia un destino no controlado. Asegúrate de que la
      acción del formulario apunte a orígenes de confianza.
    languages: [jsx, tsx]
    severity: WARNING
    pattern-either:
      - pattern: <form ... action={$V} ...>
      - pattern: <form ... action="$V" ...>
