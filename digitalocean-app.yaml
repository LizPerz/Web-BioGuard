# DigitalOcean App Platform · BioGuard Frontend
#
# El frontend se despliega como un "web service" que sirve el build con nginx
# (Dockerfile + nginx.conf). App Platform NO permite cabeceras personalizadas
# en sitios estáticos; nginx las aplica en producción.
#
# Uso:
#   1. Sube este repositorio a GitHub.
#   2. En DigitalOcean: Create App > escoge el repositorio > selecciona el
#      "Dockerfile" como método de despliegue (App Spec o el panel).
#   3. Ajusta la rama en el bloque `github` (por defecto: main).
#   4. Si el API desplegado difiere del por defecto, define VITE_API_URL en la
#      app (se lee en el build del Dockerfile como build arg) y actualiza
#      también src/lib/security.ts (API_ORIGIN).
#
# Referencia: https://docs.digitalocean.com/products/app-platform/references/app-spec/

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

name: bioguard-front

services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: LizPerz/Web-BioGuard
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    # Si el API está en otro origen y no es el por defecto:
    # envs:
    #   - key: VITE_API_URL
    #     scope: BUILD_TIME
    #     value: https://api-xxxx.ondigitalocean.app  # Ofuscado: reemplaza con la URL real
    routes:
      - path: /
        # Sin CORS abierto: orígenes EXACTOS, nunca prefijos. Un prefijo
        # "https://bioguard-" casaría con cualquier app creada por un atacante
        # en *.ondigitalocean.app (p. ej. https://bioguard-evil.ondigitalocean.app).
        # Ajusta a la URL real del frontend si usas un dominio propio.
        cors:
          allow_origins:
            - exact: https://bioguard-front.ondigitalocean.app
          allow_headers:
            - Authorization
            - Content-Type
          allow_methods:
            - GET
            - HEAD
