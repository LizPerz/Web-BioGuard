# BioGuard · nginx: SPA con cabeceras de seguridad y fallback de rutas.
# La CSP se inyecta en el HTML en tiempo de build (meta-tag), por lo que no se
# duplica aquí. frame-ancestors no aplica vía meta, así que X-Frame-Options
# cubre el anti-framing.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    # ── Cabeceras de seguridad ──────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Activos con hash: caché larga e inmutable (nombres tipo index-ABC.js).
    # NOTA: no usar add_header aquí (anularía la herencia de las cabeceras de
    # seguridad del bloque server). `expires` sí se hereda y fija Cache-Control.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Imágenes / favicon
    location ~* \.(png|svg|ico|webp|avif)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Fallback de rutas del SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # (Opcional) Proxy del API si se despliega el backend en el mismo
    # proyecto de App Platform y el frontend llama por ruta relativa:
    # location /api/ {
    #     proxy_pass http://${API_HOST};
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
